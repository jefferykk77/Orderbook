syntax = "proto3";

package grpc.health.v1;

option go_package = "orderbook/api/proto/grpc/health;healthpb";

// 标准 gRPC 健康检查协议。Kubernetes 和 gRPC 客户端不需要了解
// 交易 API，就可以直接探测这个服务。
service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }

  ServingStatus status = 1;
}
